[package]
name = "email-serv"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["nicknad"]
license = "MIT"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
blake3 = "1.8.2"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.54", features = ["env", "derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
lettre = { version = "0.11.4", features = ["tokio1", "tokio1-native-tls"] }
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tera = "1.20.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["limit"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.22", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2.4"

[dev-dependencies]
bytes = "1.11.0"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = "1.8.1"
mime = "0.3.17"
reqwest = "0.13.1"
rustls = "0.23.36"
