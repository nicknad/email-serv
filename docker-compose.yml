version: '3.8'

services:
  email-serv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-serv
    restart: unless-stopped
    
    # Environment variables. Docker Compose automatically reads values from a
    # local `.env` file (copy `.env.sample` to `.env` and fill it in).
    environment:
      - RUST_LOG=${RUST_LOG:-email-serv=info}
      - PORT=8080
      - LOG_DIR=/app/logs
      - DB_CONN=/app/data/subscribers.db
      - SITE_URL=${SITE_URL:-http://localhost:8080}
      - BLAKE3_KEY=${BLAKE3_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    
    # Port mapping
    ports:
      - "8080:8080"
    
    # Volume mounts for persistence
    volumes:
      # Persist database
      - email_data:/app/data
      # Persist logs
      - email_logs:/app/logs
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health_check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  email_data:
    driver: local
  email_logs:
    driver: local